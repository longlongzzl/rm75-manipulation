name: unified-scenario-tests

on:
  push:
    branches:
      - chatgpt/unified-three-scenarios
  pull_request:
    paths:
      - "rm75_app/scenarios/**"
      - "tests/test_scenario_program_runner.py"
      - "tests/test_sorting_scenario.py"
      - "tests/test_magnetic_assembly.py"
      - "tests/test_magnetic_plan_compilation.py"
      - "tests/test_magnetic_pickplace_adapter.py"
      - "tests/test_pusht_scenario.py"
      - "tests/test_pusht_tracking.py"
      - "tests/test_pickplace_program.py"
      - "tests/test_rrtrack_scenario_bridge.py"
      - "tests/test_release_readiness.py"
      - ".github/workflows/unified-scenario-tests.yml"

jobs:
  pure-python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest trimesh pyyaml
      - name: Compile scenario modules
        run: python -m compileall -q rm75_app/scenarios
      - name: Test scenario runner
        run: python -m pytest -q tests/test_scenario_program_runner.py
      - name: Test sorting frontend
        run: python -m pytest -q tests/test_sorting_scenario.py
      - name: Test magnetic rules and geometry
        run: python -m pytest -q tests/test_magnetic_assembly.py
      - name: Test magnetic plan compilation
        run: python -m pytest -q tests/test_magnetic_plan_compilation.py
      - name: Test magnetic PickPlace adapter
        run: python -m pytest -q tests/test_magnetic_pickplace_adapter.py
      - name: Test Push-T planning and control
        run: python -m pytest -q tests/test_pusht_scenario.py
      - name: Test Push-T tracker adapter
        run: python -m pytest -q tests/test_pusht_tracking.py
      - name: Test shared RRTrack scenario bridge
        run: python -m pytest -q tests/test_rrtrack_scenario_bridge.py
      - name: Test release readiness diagnostics
        run: python -m pytest -q tests/test_release_readiness.py
      - name: Test full PickPlace program compilation
        run: python -m pytest -q tests/test_pickplace_program.py
